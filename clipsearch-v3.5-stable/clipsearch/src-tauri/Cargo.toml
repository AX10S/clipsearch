# ─────────────────────────────────────────────────────────────────────────────
# ClipVault — cross-platform Maccy-style launcher (clipboard + Obsidian search)
# ─────────────────────────────────────────────────────────────────────────────
[package]
name = "clipvault"
version = "0.1.0"
description = "Ultra-fast global launcher: clipboard history + Obsidian vault search"
authors = ["ClipVault"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri mobile uses; on desktop `main.rs` simply calls it.
[lib]
name = "clipvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri v2 core + plugins ────────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

# ── Async runtime ──────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# ── Database (SQLite + FTS5) ───────────────────────────────────────────────
# `bundled` forces a self-compiled SQLite with FTS5 enabled — guarantees the
# feature is present on Windows builds where the system SQLite may not have it.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# ── Filesystem watcher for Obsidian vault ──────────────────────────────────
notify = "6"
notify-debouncer-mini = "0.4"

# ── Clipboard access (cross-platform) ──────────────────────────────────────
arboard = "3"

# ── Serialization / errors / logging ───────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utilities ──────────────────────────────────────────────────────────────
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
parking_lot = "0.12"
once_cell = "1"
crossbeam-channel = "0.5"
dashmap = "6"

# ── HTTP client (for web search suggestions) ──────────────────────────────
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# ── Image processing (for clipboard image capture) ─────────────────────────
image = { version = "0.25", default-features = false, features = ["png"] }

# ── Platform-specific: get foreground app name (for clipboard source) ──────
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
] }
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
libc = "0.2"

[features]
# This feature is used for production builds to enable strict optimizations.
custom-protocol = ["tauri/custom-protocol"]

# ── Release profile tuned for low-latency startup ──────────────────────────
[profile.release]
opt-level = 3
lto = true            # whole-program link-time optimization
codegen-units = 1     # better optimization at the cost of compile time
panic = "abort"       # smaller binaries, no unwind tables
strip = true          # strip debug symbols
